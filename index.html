<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventaris Lab Geofisika</title>
<meta name="theme-color" content="#F2F2F4">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* token warna sama dengan SIM (gaya 19 Okt 2026) */
:root{--bg:#F2F2F4;--surface:#fff;--surface-2:#F8FAFC;--border:#E2E8F0;--text:#0F172A;--muted:#475569;
 --brand:#EA580C;--brand-strong:#C2410C;--brand-soft:#FFEDD5;--brand-text:#9A3412;
 --ok:#15803D;--ok-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#B91C1C;--bad-soft:#FEE2E2;--info:#1D4ED8;--info-soft:#DBEAFE;
 --ring:#2563EB;--pill:#111114;--on-pill:#fff;
 --shadow:0 1px 2px rgba(17,17,26,.04),0 8px 24px rgba(17,17,26,.05);--shadow-lg:0 14px 34px rgba(17,17,26,.12)}
:root[data-theme="dark"]{--bg:#0B0F17;--surface:#141A26;--surface-2:#101521;--border:#334155;--text:#F8FAFC;--muted:#94A3B8;
 --brand:#FB923C;--brand-strong:#F97316;--brand-soft:#3A2210;--brand-text:#FDBA74;--ok:#4ADE80;--ok-soft:#14352A;--warn:#FBBF24;--warn-soft:#3A2E10;--bad:#F87171;--bad-soft:#3B1515;--info:#93C5FD;--info-soft:#1E2F52;
 --ring:#93C5FD;--pill:#F5F5F7;--on-pill:#111114;--shadow:0 1px 0 rgba(255,255,255,.03) inset;--shadow-lg:0 14px 34px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0F17;--surface:#141A26;--surface-2:#101521;--border:#334155;--text:#F8FAFC;--muted:#94A3B8;
 --brand:#FB923C;--brand-strong:#F97316;--brand-soft:#3A2210;--brand-text:#FDBA74;--ok:#4ADE80;--ok-soft:#14352A;--warn:#FBBF24;--warn-soft:#3A2E10;--bad:#F87171;--bad-soft:#3B1515;--info:#93C5FD;--info-soft:#1E2F52;
 --ring:#93C5FD;--pill:#F5F5F7;--on-pill:#111114;--shadow:0 1px 0 rgba(255,255,255,.03) inset;--shadow-lg:0 14px 34px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Fira Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:"Fira Code",monospace;font-size:.9em}
.sub{color:var(--muted);font-size:13px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px)}
header img{width:40px;height:40px;padding:4px;border-radius:12px;background:var(--brand-soft)}
header b{display:block;line-height:1.2;font-size:16px}header span{font-size:12px;color:var(--muted)}
.hb{margin-left:auto;display:flex;gap:8px}
.rb{width:42px;height:42px;border-radius:999px;border:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;position:relative}
main{max-width:1100px;margin:0 auto;padding:6px 16px 110px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:999px;min-height:44px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,#DD5A0F,#C2410C);border-color:#C2410C;color:#fff;box-shadow:0 2px 8px rgba(234,88,12,.28)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--border) 60%,transparent);border-radius:20px;box-shadow:var(--shadow)}
/* kartu angka */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.st{padding:16px 18px;border-radius:20px;border:1px solid color-mix(in srgb,var(--border) 60%,transparent);background:var(--surface);box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.st:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.st b{display:block;font:600 30px/1.1 "Fira Sans";letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--muted)}
.st.hero{background:radial-gradient(120% 140% at 85% 0%,#FB923C 0%,#EA580C 45%,#C2410C 100%);border-color:transparent;color:#fff}.st.hero span{color:#fff}
.st.on{outline:2px solid var(--brand);outline-offset:2px}
/* saringan */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input,.tools select{flex:1 1 150px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
.tools input[type=search]{flex:2 1 240px}
/* daftar */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.it{display:flex;gap:12px;align-items:center;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.it:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.th{flex:none;width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.it-t{min-width:0;flex:1}.it-t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.k-Baik{background:var(--ok-soft);color:var(--ok)}.k-Perlu{background:var(--warn-soft);color:var(--warn)}.k-Rusak{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;height:56px;padding:0 22px;font-size:16px;font-weight:600;box-shadow:0 10px 24px rgba(234,88,12,.4)}
.warnbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;margin:10px 0}
.warnbar .btn{margin-left:auto}
/* detail */
.det{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.det-f{aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.det-f img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;padding:18px;margin:0}
.kv dt{color:var(--muted);font-size:14px}.kv dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kel{padding:6px 8px 10px;margin-top:14px;overflow-x:auto}.kel h2{font-size:16px;margin:10px 10px 4px}
.rw-f{display:grid;grid-template-columns:150px 1fr auto;gap:8px;padding:6px 10px 10px}
.rw{list-style:none;margin:0;padding:0 10px}.rw li{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
@media (max-width:720px){.rw-f{grid-template-columns:1fr auto}.rw-f input[type=date]{grid-column:span 2}.rw li{grid-template-columns:1fr auto}.rw li .sub{grid-column:span 2}}
/* formulir */
dialog{border:0;border-radius:22px;padding:0;width:min(640px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--surface);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(2px)}
dialog form{padding:20px}
dialog h3{margin:0 0 12px;font-size:19px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;margin:16px 0 10px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:-20px;background:var(--surface);padding:12px 0 0}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 12px}
.scan{display:flex;gap:14px;align-items:center;padding:12px;border:1px dashed var(--border);border-radius:16px;background:var(--surface-2)}
#scanPrev{flex:none;width:84px;height:84px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
#scanPrev img{width:100%;height:100%;object-fit:cover}
.scan>div:last-child{flex:1;min-width:0}
.scan .hint{margin:6px 0 0}.scan-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scan-hit{outline:2px solid var(--brand);outline-offset:1px;background:var(--brand-soft)!important}
.krow{display:grid;grid-template-columns:2fr 70px 1.4fr 1fr 1fr 40px;gap:6px;margin-bottom:6px}
.krow input,.krow select{min-height:40px;padding:6px 8px;font-size:14px}
.krow button{min-height:40px;padding:0;border-radius:10px}
.kh{font-size:11px;color:var(--muted);font-weight:600}
/* menu */
.menu{position:absolute;right:0;top:48px;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--text);font:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:44px}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu small{display:block;color:var(--muted);padding:4px 12px 6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);animation:blurIn .3s both}
/* label QR: ukuran sama dengan label SIM */
.qrl{display:flex;gap:3mm;align-items:center;border:1px dashed #999;border-radius:2mm;padding:3mm;width:85mm;height:38mm;break-inside:avoid;background:#fff;color:#000;font-family:"Fira Sans",Arial,sans-serif;margin:0 auto}
.qrl-q{flex:none;width:30mm;height:30mm}.qrl-q svg{width:100%;height:100%;display:block}
.qrl-t{display:flex;flex-direction:column;gap:.8mm;min-width:0}
.qrl-h{display:flex;align-items:center;gap:1.5mm;font-size:7.5pt;color:#444}.qrl-h img{width:5mm;height:5mm}
.qrl b{font-size:10pt;line-height:1.2}.qrl-k{font:600 10pt "Fira Code",monospace}.qrl-d{font-size:8pt}.qrl small{font-size:7pt;color:#555}
/* animasi */
@keyframes blurIn{from{opacity:0;filter:blur(10px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}
#app.enter>*{animation:blurIn .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>:nth-child(2){animation-delay:.06s}#app.enter>:nth-child(3){animation-delay:.12s}#app.enter>:nth-child(4){animation-delay:.18s}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
@media (max-width:720px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.st b{font-size:26px}
 .det{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr;padding:14px}
 .row2{grid-template-columns:1fr}
 /* kelengkapan di HP: nama+jumlah+hapus / no. seri / kondisi+simpan */
 .krow{grid-template-columns:1fr 1fr 64px 44px;grid-template-areas:"n n j x" "s s s s" "k k p p";padding:8px;border:1px solid var(--border);border-radius:12px}
 .krow [data-f=nama]{grid-area:n}.krow [data-f=jumlah]{grid-area:j}.krow button{grid-area:x}.krow [data-f=seri]{grid-area:s}.krow [data-f=kondisi]{grid-area:k}.krow [data-f=simpan]{grid-area:p}
 .kh{display:none}
 header span{display:none}
 #dlg .qrl{zoom:.86}
}
</style>
</head>
<body>
<header>
 <img src="logo.png" alt="">
 <div><b>Inventaris Lab</b><span>Laboratorium Teknik Geofisika · Universitas Pertamina</span></div>
 <div class="hb">
  <button class="rb" id="scanBtn" aria-label="Pindai QR atau barcode" title="Pindai QR/barcode"></button>
  <button class="rb" id="theme" aria-label="Ganti tema terang/gelap" title="Ganti tema"></button>
  <div style="position:relative"><button class="rb" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false"></button><div class="menu" id="menu" hidden></div></div>
 </div>
</header>
<main id="app"></main>
<button class="btn primary fab" id="fab" onclick="formAset()"></button>
<dialog id="dlg"></dialog>

<script>
/* Inventaris Lab (22 Okt 2026): aplikasi pendata inventaris untuk HP, sebelum SIM online.
   Model data SAMA dengan db.assets di SIM (prototype/inventaris.js), foto sama dengan FOTO di foto.js,
   jadi hasil "Ekspor untuk SIM" (JSON) tinggal digabung ke SIM.
   Data disimpan di IndexedDB browser HP ini saja; cadangkan berkala lewat menu. */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={plus:'<path d="M12 5v14M5 12h14"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/>',
 print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><path d="M6 14h12v7H6z"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
 qr:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
 back:'<path d="M15 18l-6-6 6-6"/>',down:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',up:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',sheet:'<path d="M4 4h16v16H4zM4 10h16M4 15h16M10 4v16"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- konstanta dari SIM ---------- */
const JENIS_ASET=['Alat ukur','Komputer','Perabot','Lainnya'];
const MODE_TXT={Disewakan:'Disewakan',Dipinjamkan:'Dipinjamkan gratis',Tetap:'Tetap di tempat'};
const MODE_HINT={Disewakan:'Ada di SK tarif. Bisa dipinjam pihak internal dan eksternal, dan dikenai tarif.',Dipinjamkan:'Boleh dipinjam pihak internal tanpa tarif.',Tetap:'Tidak dipinjam. Hanya dicatat beserta lokasinya.'};
const KOND=['Baik','Perlu servis','Rusak'];
const LOK=[['lab:7101','7101 Laboratorium Geofisika Terapan (umum)'],['room:R7101-U','7101 · Ruang Lab Utama'],['room:R7101-D','7101 · Ruang Diskusi'],['room:R7306','7306 Laboratorium Geofisika Komputasi']];
const ROOM_LAB={'R7101-U':'7101','R7101-D':'7101','R7306':'7306'};
// kategori alat ukur & kodenya mengikuti "Stock Opname Lab Geofisika.xlsx" (II. Keterangan Kategori)
const KAT0=[{n:'Geolistrik',j:'Alat ukur'},{n:'Magnetik',j:'Alat ukur'},{n:'GPR',j:'Alat ukur'},{n:'Gravity',j:'Alat ukur'},{n:'Refraksi',j:'Alat ukur'},{n:'Passive Seismic',j:'Alat ukur'},{n:'GPS',j:'Alat ukur'},{n:'Sonic Viewer',j:'Alat ukur'},{n:'Laptop',j:'Komputer'},{n:'PC',j:'Komputer'},{n:'Kursi',j:'Perabot'},{n:'Meja',j:'Perabot'}];
const TIPE=[['A','A · Main unit'],['B','B · Kabel'],['C','C · Elektroda/Geophone'],['D','D · Charger'],['E','E · Aksesoris'],['F','F · Sensor']];
const lokKey=a=>a.ruang?'room:'+a.ruang:'lab:'+(a.lokasi||'7101');
const lokTxt=a=>(LOK.find(l=>l[0]===lokKey(a))||[,a.lokasi||'-'])[1];
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';

/* ---------- penyimpanan: IndexedDB (foto bisa banyak, localStorage hanya ±5 MB) ---------- */
const idb=new Promise((ok,no)=>{const r=indexedDB.open('inventaris-lab',1);
 r.onupgradeneeded=()=>['aset','foto','meta'].forEach(n=>r.result.createObjectStore(n,n==='aset'?{keyPath:'id'}:undefined));
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function tx(stores,fn){const d=await idb;return new Promise((ok,no)=>{const t=d.transaction(stores,'readwrite');const out=fn(...[].concat(stores).map(s=>t.objectStore(s)));t.oncomplete=()=>ok(out&&out.result);t.onerror=t.onabort=()=>no(t.error)})}
const all=s=>tx(s,o=>o.getAll());
let A=[],FOTO={},META={kategori:KAT0,cadang:null,ubah:null};
async function muat(){
 A=await all('aset');
 const d=await idb;
 await new Promise(ok=>{const t=d.transaction(['foto','meta']);const f=t.objectStore('foto'),m=t.objectStore('meta');
  f.openCursor().onsuccess=e=>{const c=e.target.result;if(c){FOTO[c.key]=c.value;c.continue()}};
  m.get('meta').onsuccess=e=>{if(e.target.result)META=Object.assign(META,e.target.result);// kategori bawaan versi lama diganti nama Excel stok opname; yang masih dipakai aset tetap dipertahankan
   META.kategori=META.kategori.filter(k=>!['Seismik','Seismometer','Gayaberat','Survei','Karakterisasi batuan (Vp/Vs)'].includes(k.n)||A.some(a=>a.kat===k.n));
   KAT0.forEach(k=>{if(!META.kategori.some(x=>x.n===k.n))META.kategori.push(k)})};t.oncomplete=ok});
}
const simpanMeta=()=>tx('meta',m=>m.put(META,'meta'));
async function tandaiUbah(){META.ubah=new Date().toISOString();await simpanMeta();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}

/* ---------- tampilan ---------- */
const st={q:'',fj:'Semua',fl:'Semua',fk:'Semua',view:'list',id:null};
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const thumb=a=>FOTO[a.id]?`<img src="${FOTO[a.id]}" alt="">`:ic('box');
const kBadge=k=>`<span class="badge k-${esc((k||'Baik').split(' ')[0])}">${esc(k||'Baik')}</span>`;
const jml=a=>a.jumlah?`${a.jumlah} ${esc(a.satuan||'unit')}`:'1 unit';
// barang banyak yang sebagian rusak/servis ikut terhitung di kartu angka dan saringan

const KODE_KAT={'Geolistrik':'GLS','Magnetik':'MAG','GPR':'GPR','Gravity':'GRV','Refraksi':'REF','Passive Seismic':'PSF','GPS':'GPS','Sonic Viewer':'SNV',
 'Laptop':'LPT','Kursi':'KRS','Meja':'MJA'};

function saranKode(kat,jenis,tahun,tipe){
 if(kat==='PC')return 'GP-PC-'+String(nomorPC()).padStart(3,'0'); // nomornya sama dengan nama COMPGP-PCxx
 const nn=f=>{let i=1;while(A.some(a=>a.id===f(String(i).padStart(2,'0'))))i++;return f(String(i).padStart(2,'0'))};
 if(jenis==='Alat ukur'){const yy=/^\d{4}$/.test(tahun)?tahun.slice(2):'??';return nn(n=>`GP-${singkat(kat)}${yy}-${n}${tipe||'A'}`)}
 let i=1;while(A.some(a=>a.id===`GP-${singkat(kat)}-${String(i).padStart(3,'0')}`))i++;return `GP-${singkat(kat)}-${String(i).padStart(3,'0')}`;
}

  const o=Object.assign(a?{...a}:{perawatan:false,tarif:[]},{id:nid,nama,kat,jenis,mode,disewakan:mode==='Disewakan',lokasi:ruang?ROOM_LAB[ruang]:lv.slice(4),ruang,
   noInv:$('#f-inv').value.trim(),kondisi:$('#f-kond').value,kalibrasi:jenis==='Alat ukur'?$('#f-kal').value:'',
   seri:['Alat ukur','Komputer','Lainnya'].includes(jenis)?$('#f-seri').value.trim():'',spek:['Komputer','Lainnya'].includes(jenis)?$('#f-spek').value.trim():'',
   garansi:jenis==='Komputer'?$('#f-gar').value:'',aplikasi:jenis==='Komputer'?$('#f-app').value.trim():'',
   jumlah:bulk&&j>0?j:undefined,satuan:bulk?($('#f-sat').value.trim()||'unit'):undefined,jmlRusak:bulk?jr:undefined,jmlServis:bulk?js:undefined,
   tahun:thn,tipe:jenis==='Alat ukur'?$('#f-tipe').value:'',catatan:$('#f-cat').value.trim(),kelengkapan:kel,diubah:new Date().toISOString()});
  try{
   await tx(['aset','foto'],(s,f)=>{
    if(!isNew&&nid!==a.id){s.delete(a.id);if(FOTO[a.id]&&!scanFoto&&!hapusF)f.put(FOTO[a.id],nid);f.delete(a.id)}
    s.put(o);
    if(scanFoto)f.put(scanFoto,nid);else if(hapusF)f.delete(nid);
   });
  }catch(x){return err('Gagal menyimpan di perangkat ('+esc(x&&x.name)+'). Memori HP mungkin penuh.')}
  if(!isNew&&nid!==a.id){if(FOTO[a.id]&&!scanFoto&&!hapusF)FOTO[nid]=FOTO[a.id];delete FOTO[a.id]}
  if(scanFoto)FOTO[nid]=scanFoto;else if(hapusF)delete FOTO[nid];
  const i=A.findIndex(x=>x.id===(a?a.id:nid));if(i>=0)A[i]=o;else A.push(o);
  await tandaiUbah();
  $('#dlg').close();toast(isNew?'Aset ditambahkan.':'Aset diperbarui.');
  if(isNew){go('detail',nid);labelQR([nid])}else go('detail',nid);
 };
}
function fotoSaja(){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
 inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
  try{scanFoto=await fotoKecil(f);$('#scanPrev').innerHTML=`<img src="${scanFoto}" alt="Foto alat">`;$('#scanSt').textContent='Foto siap disimpan.'}catch(e){toast('Foto tidak bisa dibaca. Coba file lain.')}};
 inp.click();
}
// perkecil ke sisi terpanjang `max` px; sama dengan fotoKecil di SIM (foto.js)
function fotoKecil(file,max=640,q=.75){
 return new Promise((ok,gagal)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
   const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
   let d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);ok(d)};
  img.onerror=()=>{URL.revokeObjectURL(u);gagal()};img.src=u});
}
async function hapus(id){
 const a=A.find(x=>x.id===id);if(!a||!confirm(`Hapus ${a.nama} (${id})? Tindakan ini tidak bisa dibatalkan.`))return;
 await tx(['aset','foto'],(s,f)=>{s.delete(id);f.delete(id)});
 A=A.filter(x=>x.id!==id);delete FOTO[id];await tandaiUbah();toast('Aset dihapus.');go('list');
}

/* ---------- label QR (desain sama dengan label SIM) ---------- */
// tanpa domain: QR berisi alamat aplikasi ini + #a/KODE; dibuka dari file lokal, QR berisi kode saja
const qrIsi=id=>location.protocol.startsWith('http')?location.origin+location.pathname+'#a/'+encodeURIComponent(id):id;
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}
const labelHTML=a=>`<div class="qrl"><div class="qrl-q">${qrSvg(qrIsi(a.id))}</div><div class="qrl-t"><div class="qrl-h"><img src="${new URL('logo.png',location.href).href}" alt="">Lab Teknik Geofisika · UPer</div>
 <b>${esc(a.nama)}</b><span class="qrl-k">${esc(a.id)}</span><span class="qrl-d">S/N: ${esc(a.seri||'…………………')}</span><span class="qrl-d">No. Inv: ${esc(a.noInv||'…………………')}</span><small>Pindai untuk detail</small></div></div>`;
function labelQR(ids){
 const L=ids.map(id=>A.find(a=>a.id===id)).filter(Boolean);if(!L.length)return toast('Belum ada aset.');
 const dlg=$('#dlg');
 dlg.innerHTML=`<form method="dialog"><h3>Label QR${L.length>1?` · ${L.length} aset`:' · '+esc(L[0].nama)}</h3>
  <div style="display:grid;gap:10px;max-height:52vh;overflow:auto;padding:4px">${L.slice(0,L.length>1?4:1).map(labelHTML).join('')}${L.length>4?`<p class="sub" style="text-align:center">…dan ${L.length-4} label lagi</p>`:''}</div>
  <p class="hint">Ukuran label 85 × 38 mm, 2 kolom per A4. QR berisi: <span class="mono">${esc(qrIsi(L[0].id))}</span></p>
  <div class="dlg-actions"><button class="btn">Tutup</button><button type="button" class="btn primary" onclick="cetakLabel(${esc(JSON.stringify(ids))})">${ic('print')} Cetak / simpan PDF</button></div></form>`;
 dlg.showModal();
}
function cetakLabel(ids){
 const w=window.open('','_blank');if(!w)return toast('Jendela cetak diblokir. Izinkan pop-up untuk halaman ini.');
 const css=[...document.styleSheets[document.styleSheets.length-1].cssRules].filter(r=>/\.qrl/.test(r.selectorText||'')).map(r=>r.cssText).join('');
 w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Label QR inventaris</title><link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&family=Fira+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;background:#fff}.sheet{display:grid;grid-template-columns:repeat(2,85mm);gap:4mm;justify-content:center}${css}</style></head>
  <body><div class="sheet">${ids.map(id=>A.find(a=>a.id===id)).filter(Boolean).map(labelHTML).join('')}</div><script>window.onload=()=>setTimeout(()=>window.print(),500)<\/script></body></html>`);
 w.document.close();
}

/* ---------- pindai QR / barcode dari foto (BarcodeDetector bawaan Chrome Android) ---------- */
function pindai(){
 if(!('BarcodeDetector' in window))return toast('Browser ini belum bisa memindai. Pakai aplikasi kamera HP untuk memindai QR label.');
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
 inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
  try{
   const r=await new BarcodeDetector().detect(await createImageBitmap(f));
   if(!r.length)return toast('QR/barcode tidak terbaca. Foto lebih dekat dan terang.');
   const v=r[0].rawValue.trim(),m=v.match(/#(?:a|aset)\/([^?#]+)/),id=decodeURIComponent(m?m[1]:v).toUpperCase();
   if(A.some(a=>a.id===id))return go('detail',id);
   const ai=A.find(a=>a.noInv&&a.noInv.toUpperCase()===v.toUpperCase());if(ai)return go('detail',ai.id);
   if(confirm(`Kode "${v}" belum terdaftar. Tambah aset baru dengan nomor inventaris ini?`))formAset(null,{noInv:v});
  }catch(e){toast('Gagal memindai: '+(e&&e.message||e))}};
 inp.click();
}

/* ---------- cadangan, ekspor untuk SIM, Excel ---------- */
function unduh(nama,isi,tipe){const u=URL.createObjectURL(new Blob([isi],{type:tipe}));const a=document.createElement('a');a.href=u;a.download=nama;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
// format sama dengan SIM: assets = db.assets, kategori = db.kategori, foto = FOTO (localStorage 'sim-lab-foto')
async function ekspor(){
 const out={sumber:'Inventaris Lab Geofisika',format:1,dibuat:new Date().toISOString(),kategori:META.kategori,assets:A,foto:FOTO};
 unduh(`inventaris-lab-${today()}.json`,JSON.stringify(out),'application/json');
 META.cadang=new Date().toISOString();await simpanMeta();render();toast('Cadangan diunduh. Simpan file ini di Drive/laptop.');
}
// teks bertab UTF-16 + BOM: Excel membukanya per kolom apa pun pemisah daftar di Windows (Indonesia memakai ";")
const tsvSel=v=>{v=String(v??'').replace(/[\t\r\n]+/g,' ');return /^[=+\-@]/.test(v)?"'"+v:v};
function eksporCSV(){
 const H=['Kode','Nama','Jenis','Kategori','Jenis komponen','Tahun pengadaan','No. inventaris','No. seri','Lokasi','Kondisi','Jumlah','Satuan','Rusak','Perlu servis','Kalibrasi berikutnya','Spesifikasi','Aplikasi terpasang','Garansi','Pemakaian','Kelengkapan','Catatan','Riwayat catatan','Ada foto'];
 const R=A.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(a=>[a.id,a.nama,a.jenis,a.kat,(TIPE.find(t=>t[0]===a.tipe)||[,''])[1],a.tahun,a.noInv,a.seri,lokTxt(a),a.kondisi||'Baik',a.jumlah||1,a.satuan||'unit',a.jmlRusak||0,a.jmlServis||0,a.kalibrasi,a.spek,(a.aplikasi||'').split('\n').filter(Boolean).join(', '),a.garansi,MODE_TXT[a.mode]||a.mode,
  (a.kelengkapan||[]).map(k=>`${k.nama} (${k.jumlah}${k.seri?', '+k.seri:''}, ${k.kondisi})`).join('; '),a.catatan,(a.riwayat||[]).map(r=>`${r.tgl}: ${r.isi}`).join(' | '),FOTO[a.id]?'Ya':'Tidak']);
 const s='﻿'+[H,...R].map(r=>r.map(tsvSel).join('\t')).join('\r\n'),b=new Uint8Array(s.length*2);
 for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);b[2*i]=c&255;b[2*i+1]=c>>8}
 unduh(`rekap-inventaris-${today()}.csv`,b,'text/csv');
}
function impor(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){return toast('File bukan cadangan yang valid.')}
  const L=Array.isArray(d&&d.assets)?d.assets.filter(a=>a&&typeof a.id==='string'&&typeof a.nama==='string'&&/^[A-Z0-9][A-Z0-9\-\/.]{1,39}$/i.test(a.id)):null;
  if(!L||!L.length)return toast('Tidak ada data aset di file ini.');
  const foto=Object.fromEntries(Object.entries(d.foto||{}).filter(([k,v])=>L.some(a=>a.id===k)&&typeof v==='string'&&/^data:image\/(webp|jpeg|png);base64,/.test(v)));
  const sama=L.filter(a=>A.some(x=>x.id===a.id)).length;
  if(!confirm(`Impor ${L.length} aset (${Object.keys(foto).length} foto)?${sama?`\n${sama} aset dengan kode sama akan ditimpa.`:''}`))return;
  await tx(['aset','foto'],(s,fs)=>{L.forEach(a=>s.put(a));Object.entries(foto).forEach(([k,v])=>fs.put(v,k))});
  (Array.isArray(d.kategori)?d.kategori:[]).forEach(k=>{if(k&&typeof k.n==='string'&&!META.kategori.some(x=>x.n===k.n))META.kategori.push({n:k.n,j:JENIS_ASET.includes(k.j)?k.j:'Lainnya'})});
  L.forEach(a=>{const i=A.findIndex(x=>x.id===a.id);if(i>=0)A[i]=a;else A.push(a)});Object.assign(FOTO,foto);
  await tandaiUbah();go('list');toast(`${L.length} aset diimpor.`)};
 inp.click();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')tutupMenu()});
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('inv-theme',t)}catch(e){}$('#theme').innerHTML=ic(t==='dark'?'sun':'moon');document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0B0F17':'#F2F2F4'}
$('#theme').onclick=e=>{
 const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
 if(!document.startViewTransition||calm())return setTheme(t);
 const r=e.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 document.startViewTransition(()=>setTheme(t)).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:600,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'}));
};
$('#menuBtn').innerHTML=ic('more');$('#scanBtn').innerHTML=ic('qr');$('#scanBtn').onclick=pindai;$('#fab').innerHTML=ic('plus')+' Tambah aset';
let t0;try{t0=localStorage.getItem('inv-theme')}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

muat().then(()=>{const m=location.hash.match(/^#a\/(.+)/),id=m&&decodeURIComponent(m[1]);if(id&&A.some(a=>a.id===id)){st.view='detail';st.id=id}render(true)})
 .catch(e=>{$('#app').innerHTML=`<div class="card empty">Penyimpanan browser tidak bisa dibuka (${esc(e&&e.message)}). Jangan pakai mode penyamaran/incognito.</div>`});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
